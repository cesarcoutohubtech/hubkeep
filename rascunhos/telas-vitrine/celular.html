<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Vitrine, largura de celular</title>
    <style>
      html, body { margin: 0; background: #888; }
      iframe { display: block; width: 390px; border: 0; height: 100vh; }
    </style>
  </head>
  <body>
    <script>
      const p = new URLSearchParams(location.search);
      const f = document.createElement('iframe');
      f.src = '/vitrine/index.html?tela=' + (p.get('tela') || 'lista') + (p.get('tema') ? '&tema=' + p.get('tema') : '');
      document.body.append(f);
    </script>
  </body>
</html>
