<h2>Você foi convidado para o HubKeep</h2>
<p>Olá, {{ .Data.nome }}.</p>
<p>Você recebeu acesso ao grupo <strong>{{ .Data.tenant }}</strong> no HubKeep.</p>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=invite">Aceitar o convite</a></p>
<p>Depois de aceitar, você vai definir sua senha.</p>
<p>Se você não esperava este convite, ignore este e-mail.</p>
