name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Toda segunda às 9h (Brasília): falha nova de dependência aparece mesmo sem PR.
  schedule:
    - cron: '0 12 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: lint, typecheck e testes
    runs-on: ubuntu-latest
    # Hoje leva uns 2 minutos; o teto evita um job preso por 6 horas (B13).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Versão do pnpm vem do campo packageManager do package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Auditoria de dependências (F0-13): vulnerabilidade alta ou crítica
      # conhecida em qualquer dependência, de produção ou de desenvolvimento,
      # reprova. Para aceitar uma exceção, o caminho é atualizar a dependência
      # ou registrar o motivo em pnpm.auditConfig.ignoreCves, revisado no PR.
      - name: Auditoria de dependências
        run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
