name: Mews formatter temporary (read only)

on:
  push:
    branches: [claude/eu-mews-painel-admin-v1-20261017]

permissions:
  contents: read

jobs:
  formatar:
    name: formatar Mews V1 (temporario)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aplicar Prettier e emitir apenas o conteudo dos quatro arquivos
        shell: bash
        run: |
          pnpm exec prettier --write "apps/web/src/app/(painel)/admin/mews/page.tsx" apps/web/src/cliente/moldura.tsx apps/web/test/moldura.test.ts packages/db/src/mews-admin.ts
          printf 'MEWS_ADMIN_PAGE_B64='
          base64 -w0 "apps/web/src/app/(painel)/admin/mews/page.tsx"
          echo
          printf 'MEWS_MOLDURA_B64='
          base64 -w0 apps/web/src/cliente/moldura.tsx
          echo
          printf 'MEWS_MOLDURA_TEST_B64='
          base64 -w0 apps/web/test/moldura.test.ts
          echo
          printf 'MEWS_ADAPTER_B64='
          base64 -w0 packages/db/src/mews-admin.ts
          echo
