# Testes de banco na CI: Supabase local no runner (descartável), migrações do
# zero e pgTAP. É o único lugar onde o Supabase roda em Docker (ADR-015), e o
# check obrigatório para merge em main (ruleset "main: CI de banco obrigatória").
# O nome do job é o do check exigido pelo ruleset: renomear quebra o merge.
name: banco

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: banco-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pgtap:
    name: pgTAP (meta e isolamento)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Chave ES256 do Auth do runner, como a do HubKeep-dev: a API valida o JWT
      # pelo JWKS público (F0-05). Gerada aqui, fora do git, e morre com o runner;
      # a CLI grava no arquivo e não imprime a parte privada. O config.toml traz
      # o signing_keys_path comentado (sem o arquivo, a CLI recusaria db push na
      # máquina de quem opera o dev); só aqui ele é ligado, antes de gerar a
      # chave, e o grep falha o passo se a troca não acontecer.
      - name: Chave de assinatura JWT (ES256) do runner
        run: |
          sed -i 's|^# signing_keys_path = "./signing_keys.json"$|signing_keys_path = "./signing_keys.json"|' supabase/config.toml
          grep -qx 'signing_keys_path = "./signing_keys.json"' supabase/config.toml
          echo '[]' > supabase/signing_keys.json
          supabase gen signing-key --algorithm ES256 --append --yes > /dev/null

      # Banco, Auth (e Kong, que o expõe) e o Mailpit, onde chega o e-mail de
      # convite da F0-05. Os demais serviços não entram nos testes.
      - name: Subir Supabase local no runner
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,supavisor,postgres-meta

      - name: Aplicar migrações do zero
        run: supabase db reset

      - name: Testes pgTAP (meta e isolamento)
        run: supabase test db

      # Scripts de operação da F0-03 contra o banco do runner. Credenciais do
      # Postgres local são as fixas e descartáveis do Supabase CLI; as senhas
      # dos papéis são geradas aqui, mascaradas no log e morrem com o runner.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Papéis por ambiente — configurar (duas vezes) e verificar
        env:
          CI_DATABASE_URL_OWNER: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          gerar() { openssl rand -base64 48 | tr -d '\n=+/'; }
          export HK_APP_SENHA_CI="$(gerar)" HK_WORKER_SENHA_CI="$(gerar)" HK_INGESTAO_SENHA_CI="$(gerar)"
          for s in "$HK_APP_SENHA_CI" "$HK_WORKER_SENHA_CI" "$HK_INGESTAO_SENHA_CI"; do echo "::add-mask::$s"; done
          pnpm -s db:papeis --ambiente ci --dry-run
          pnpm -s db:papeis --ambiente ci
          pnpm -s db:papeis --ambiente ci
          pnpm -s db:verificar-papeis --ambiente ci
          # URLs dos papéis para os testes de integração do passo seguinte
          # (senhas já mascaradas acima; o runner é descartável).
          base="127.0.0.1:54322/postgres"
          {
            echo "HK_TESTE_URL_APP=postgresql://hk_app:${HK_APP_SENHA_CI}@${base}"
            echo "HK_TESTE_URL_WORKER=postgresql://hk_worker:${HK_WORKER_SENHA_CI}@${base}"
            echo "HK_TESTE_URL_DONO=${CI_DATABASE_URL_OWNER}"
          } >> "$GITHUB_ENV"

      # Os tipos do Kysely (packages/db/src/tipos-banco.ts) são gerados do banco.
      # Aqui se confere que batem com as migrações: migração nova sem
      # `pnpm db:types` quebra a CI em vez de virar tipo mentindo.
      - name: Tipos do Kysely em dia com as migrações
        working-directory: packages/db
        run: pnpm exec kysely-codegen --dialect postgres --url "env(HK_TESTE_URL_DONO)" --include-pattern "{app,staging,licenca}.*" --out-file src/tipos-banco.ts --verify

      # F0-04: withContext, withSistema e unit of work contra o banco real.
      # HK_EXIGIR_BANCO transforma "suíte pulada por falta de URL" em falha.
      - name: Integração do packages/db
        env:
          HK_EXIGIR_BANCO: '1'
        run: pnpm --filter @hubkeep/db test

      # F0-05: ambiente do Supabase local para o app web. A secret key vai só
      # para o processo de teste (o auth-admin a lê); mascarada no log.
      - name: Ambiente do Supabase local para o web
        run: |
          eval "$(supabase status -o env | sed 's/^/SB_/')"
          publica="${SB_PUBLISHABLE_KEY:-$SB_ANON_KEY}"
          secreta="${SB_SECRET_KEY:-$SB_SERVICE_ROLE_KEY}"
          echo "::add-mask::$secreta"
          test -n "$SB_API_URL" && test -n "$publica" && test -n "$secreta"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$SB_API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publica"
            echo "SUPABASE_SECRET_KEY=$secreta"
            echo "HK_MAILPIT_URL=${SB_MAILPIT_URL:-${SB_INBUCKET_URL:-http://127.0.0.1:54324}}"
            echo "DATABASE_URL_APP=$HK_TESTE_URL_APP"
            echo "DATABASE_URL_WORKER=$HK_TESTE_URL_WORKER"
            echo "HK_BANCO_SEM_TLS=1"
          } >> "$GITHUB_ENV"
          # O JWKS tem de publicar a chave ES256 gerada acima.
          curl -sf "$SB_API_URL/auth/v1/.well-known/jwks.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const k=JSON.parse(s).keys||[];console.log("JWKS:",k.map(x=>x.alg).join(","));if(!k.some(x=>x.alg==="ES256"))process.exit(1)})'

      # F0-05: convite → e-mail no Mailpit → aceite → sessão em cookie → API.
      - name: Integração do web (autenticação e tenant ativo)
        env:
          HK_EXIGIR_BANCO: '1'
        run: pnpm --filter @hubkeep/web test

      - name: pgTAP de novo, com os papéis configurados
        run: supabase test db
