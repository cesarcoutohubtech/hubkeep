name: Mews formatter (temporary; read-only)

on:
  push:
    branches: [claude/eu-mews-driver-transacional-20261017]

permissions:
  contents: read

jobs:
  formatar:
    name: formatar TS Mews (temporário)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatar e imprimir somente os dois fontes públicos ao PR
        shell: bash
        run: |
          pnpm exec prettier --write packages/db/src/repositorios/mews-persistencia.ts packages/db/test/mews-persistencia.test.ts
          printf 'MEWS_DRIVER_B64='
          base64 -w0 packages/db/src/repositorios/mews-persistencia.ts
          echo
          printf 'MEWS_TEST_B64='
          base64 -w0 packages/db/test/mews-persistencia.test.ts
          echo
