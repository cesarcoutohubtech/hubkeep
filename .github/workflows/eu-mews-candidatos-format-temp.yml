name: Mews candidatos formatter temporary

on:
  push:
    branches: [claude/eu-mews-selecao-hotel-demo-20261018]

permissions:
  contents: read

jobs:
  formatar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aplicar Prettier 3.9.10 e emitir fontes sem segredos
        shell: bash
        run: |
          pnpm exec prettier --write "apps/web/src/app/(painel)/admin/mews/candidatos.tsx" "apps/web/src/app/(painel)/admin/mews/page.tsx" apps/web/test/mews-status.test.tsx packages/db/src/mews-admin.ts packages/db/test/mews-admin.test.ts
          printf 'MEWS_CANDIDATOS_PAGE_B64='
          base64 -w0 "apps/web/src/app/(painel)/admin/mews/candidatos.tsx"
          echo
          printf 'MEWS_STATUS_PAGE_B64='
          base64 -w0 "apps/web/src/app/(painel)/admin/mews/page.tsx"
          echo
          printf 'MEWS_STATUS_TEST_B64='
          base64 -w0 apps/web/test/mews-status.test.tsx
          echo
          printf 'MEWS_DB_ADAPTER_B64='
          base64 -w0 packages/db/src/mews-admin.ts
          echo
          printf 'MEWS_DB_TEST_B64='
          base64 -w0 packages/db/test/mews-admin.test.ts
          echo
