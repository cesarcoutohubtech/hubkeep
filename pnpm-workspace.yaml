packages:
  - apps/*
  - packages/*

# Scripts de instalação ficam bloqueados por padrão (pnpm >= 10). O unrs-resolver
# (resolver do eslint-import-resolver-typescript) traz binário pré-compilado e
# não precisa do postinstall.
allowBuilds:
  unrs-resolver: false

# Exceções do pnpm audit (F0-13; regra no ci.yml): só sem versão corrigida e
# fora do que roda em produção, com o motivo, revisadas no PR.
#   GHSA-vfj7-8cjw-p6xm (braces <= 3.0.3, negação de serviço com padrão muito
#   aninhado; sem versão corrigida em 05/10/2026): só entra pelo lint de
#   fronteiras (eslint-plugin-boundaries > micromatch) e pelo gerador de tipos
#   (kysely-codegen > micromatch), ferramentas de desenvolvimento que só leem
#   padrões do próprio repositório. Revisar quando sair a correção.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

# Versões mínimas de dependências indiretas com correção de segurança, quando a
# dependência direta ainda não puxa a versão corrigida.
#   GHSA-68fv-2mgg-jv7q (source-map-js < 1.2.2, negação de serviço por offsets
#   de seção do source map; publicado em 06/10/2026): entra por vite > postcss,
#   no vitest e no build do web e do PWA. Tirar quando o postcss exigir >= 1.2.2.
#   GHSA-wq5f-xc86-pv6w (sharp < 0.35.5, falha na dependência librsvg;
#   publicado em 06/10/2026): entra por next (e @sentry/nextjs > next), na
#   otimização de imagem do web. Tirar quando o next exigir >= 0.35.5.
#   GHSA-8r5x-fm3f-whwj e GHSA-p8wg-vrv2-v86f (handlebars <= 4.7.9, injeção de
#   JavaScript no compile; publicados em 08/10/2026): entra só pelo lint de
#   fronteiras (eslint-plugin-boundaries). Tirar quando o plugin exigir >= 4.7.10.
overrides:
  source-map-js: '>=1.2.2'
  sharp: '>=0.35.5'
  handlebars: '>=4.7.10'
